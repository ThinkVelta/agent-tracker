name: Release Summary
run-name: 'Release Summary - #${{ github.event.pull_request.number }}'

# The `dev -> main` PR only. That is the one PR `pr.yml` skips the AI reviewer
# on — correctly, since every commit in it was reviewed once on the way into
# `dev` — which leaves it as the only PR here that nothing describes. Its diff
# is the release, so a summary of it is the changelog, and the release PR is
# where that is cheapest to read and easiest to correct.
#
# Deliberately NOT run on ordinary feature PRs: those already get a full review
# comment, and a summary beside it would be a second thing to read saying less.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: release-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Single job: Codex runs and the summary is posted from the same job. A
  # two-job split (codex, then post via job outputs) trips GitHub's
  # substring-secret defense, which silently blanks any job output whose value
  # contains a registered-secret substring, including false positives. That
  # defense only fires at the `jobs.<id>.outputs` boundary, so keeping
  # everything in one job sidesteps it — no outputs key exists here, and none
  # may be added. (Same constraint as `pr.yml`.)
  summary:
    # Three conditions, each ruling out a different wrong PR.
    #
    #   head_ref == 'dev'      the release PR, and the whole point
    #   base_ref == 'main'     already true from the trigger, but asserted so
    #                          this can never fire on a HOTFIX, which also
    #                          targets `main` and IS reviewed normally
    #   same repo              a fork can have a branch called `dev` too, and
    #                          GitHub withholds secrets from fork-triggered
    #                          `pull_request` runs — so this would fail on the
    #                          missing key, putting a red X on an outside
    #                          contributor's PR for a reason they can neither
    #                          see nor fix. `pr.yml` skips forks for exactly
    #                          this reason.
    if: >-
      github.head_ref == 'dev'
      && github.base_ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # `pull-requests: write` (not just `read`) is required to comment:
      # GitHub's createComment endpoint on a PR-typed issue returns 403 with
      # only `issues: write`, even though the docs claim that scope suffices.
      pull-requests: write
    steps:
      # Check out via `refs/pull/N/head`, not the merge ref or the raw head
      # SHA: the merge ref is materialized asynchronously and the checkout can
      # race it, while the `/head` ref is updated synchronously on every push.
      # Must stay first — a local `uses: ./.github/actions/...` is resolved
      # from the working tree and does not exist until the checkout has run.
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      # `refs/pull/N/head` is mutable, so a push arriving after this run was
      # queued but before the checkout would land us on a newer commit while
      # the prompt still pins Codex to the event-time SHAs. The cancelling push
      # spawns a fresh run that produces a correct summary, so fail fast rather
      # than describe one commit while claiming another.
      - name: Verify checkout matches event head SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::PR head drifted: checked out $actual but event head was $EXPECTED. A newer push should re-trigger this workflow."
            exit 1
          fi

      # Two-attempt retry: the Codex action's preflight permission check
      # occasionally gets a transient `Bad credentials` 401 from `github.token`
      # on freshly-started jobs, and the failure happens inside the action's
      # compiled binary, so a script-level retry is the only mitigation.
      # `continue-on-error` cannot be used inside a composite action, which is
      # why this pair lives here rather than in `codex-pr-summary`.
      - name: Run Codex (attempt 1)
        id: codex_try1
        uses: ./.github/actions/codex-pr-summary
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Wait before Codex retry
        if: steps.codex_try1.outcome == 'failure'
        run: sleep 20

      - name: Run Codex (attempt 2)
        id: codex_try2
        if: steps.codex_try1.outcome == 'failure'
        uses: ./.github/actions/codex-pr-summary
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Post the release summary
        uses: actions/github-script@v9.0.0
        env:
          # Gate `try1`'s output on its outcome: if `try1` failed mid-action
          # after already writing a partial `final-message`, a raw `||` would
          # pick that stale value and discard `try2`'s successful retry.
          CODEX_FINAL_MESSAGE: ${{ (steps.codex_try1.outcome == 'success' && steps.codex_try1.outputs['final-message']) || steps.codex_try2.outputs['final-message'] }}
        with:
          github-token: ${{ github.token }}
          script: |
            const MARKER = '<!-- codex-release-summary -->';
            const opts = { owner: context.repo.owner, repo: context.repo.repo };
            const prNumber = context.payload.pull_request.number;
            const raw = process.env.CODEX_FINAL_MESSAGE;

            // Fail rather than return quietly. This PR carries no review comment
            // by design, so a missing summary leaves it with nothing describing
            // it at all — and a green run with no comment looks exactly like a
            // release that genuinely had nothing to say.
            if (!raw || !raw.trim()) {
              core.setFailed('Codex produced no summary. The release PR would be left undescribed.');
              return;
            }
            const body = `${MARKER}\n${raw}`;

            const withRetry = async (fn) => {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try { return await fn(); }
                catch (err) {
                  const status = err.status ?? 0;
                  if ((status !== 401 && status < 500) || attempt === 3) throw err;
                  core.warning(`attempt ${attempt} failed with ${status}; retrying in ${attempt * 5}s`);
                  await new Promise(r => setTimeout(r, attempt * 5000));
                }
              }
            };

            // One canonical comment, updated in place if `dev` moves while the
            // release PR is open. A pile of stale summaries is worse than none:
            // this comment is meant to be read as the changelog, and the reader
            // has no way to tell which of several is current.
            const comments = await github.paginate(github.rest.issues.listComments, { ...opts, issue_number: prNumber });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER));
            await withRetry(() => existing
              ? github.rest.issues.updateComment({ ...opts, comment_id: existing.id, body })
              : github.rest.issues.createComment({ ...opts, issue_number: prNumber, body }));
